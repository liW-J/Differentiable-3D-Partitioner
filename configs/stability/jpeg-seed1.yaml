# Stability experiment – JPEG, seed 1
design:
  name: "jpeg-stability-seed1"

flow:
  num_iterations: 2000
  random_seed: 1000

  optimizer:
    name: nesterov
    learning_rate: 0.1
    use_bb: true

  lse_smoothing_alpha:
    start: 5.0
    end: 50.0

  cutsize_loss:
    enabled: true
    lambda_cut:
      start: 1.0
      end: 1.0
      gamma: 1

  balance_loss:
    enabled: true
    lambda_balance:
      start: 1
      end: 1
      gamma: 1.0

  density_loss:
    enabled: true
    lambda_density:
      start: 0.0000001
      peak: 0.0001
      end: 0.0001
      peak_ratio: 0.3
      gamma_up: 1.0
      gamma_down: 1.0

  wirelength_loss:
    lambda_wl: 1.0

partitioner:
  t_grad_scale_start: 0.0001
  t_grad_scale_end: 50.0
  t_grad_warmup_end: 500
  t_grad_ramp_end: 1500
  gumbel_tau: 0.1
  gumbel_tau_start: 1.0
  gumbel_tau_min: 0.1
  gumbel_anneal_iterations: 20000
  gumbel_anneal_mode: exponential
  gumbel_switch_iteration: 500

  balance_loss:
    top_threshold_factor: 0.55
    bottom_threshold_factor: 0.55
    num_bins_x: 50
    num_bins_y: 50

visualization:
  output_dir: "results/visualizations"
  save_interval: 50
  log_interval: 200

output:
  save_training_curves: true
  result_dir: "results"
