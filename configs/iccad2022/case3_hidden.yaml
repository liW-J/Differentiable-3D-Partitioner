# Differentiable 3D Partitioner Flow Configuration
# Heterogeneous technology case (case3_hidden)
# lib avg cell area: 15736 (TA: 33 cells, TB: 33 cells), die: 35198x34944, 44764 cells
design:
  name: "iccad2022_case3_hidden"

# Training parameters
flow:
  num_iterations: 2000
  # Fix the random seed so t initialization and Gumbel sampling are repeatable.
  random_seed: 888

  optimizer:
    name: nesterov
    learning_rate: 0.1
    use_bb: true
    
  lse_smoothing_alpha:
    start: 5.0
    end: 50.0

  # Cutsize Loss configuration
  cutsize_loss:
    enabled: true
    lambda_cut:
      start: 1.0
      end: 1.0
      gamma: 1

  # Balance Loss configuration
  balance_loss:
    enabled: true
    lambda_balance:
      start: 1
      end: 1
      gamma: 1.0

  density_loss:
    enabled: true
    lambda_density:
      start: 0.0000001
      peak: 0.001
      end: 0.001
      peak_ratio: 0.3
      gamma_up: 1.0
      gamma_down: 1.0

  # Wirelength Loss configuration
  wirelength_loss:
    lambda_wl: 1.0

# Partitioner initialization parameters
partitioner:
  t_grad_scale_start: 0.0001
  t_grad_scale_end: 50
  t_grad_warmup_end: 500
  t_grad_ramp_end: 1500
  # Gumbel Softmax temperature parameter, controls the smoothness of softmax
  # Smaller values mean results are closer to discrete distribution, larger values mean smoother distribution
  gumbel_tau: 0.1
  # Explicit Gumbel-Softmax annealing schedule for this experiment.
  # Start from a smoother temperature and anneal to gumbel_tau across training.
  gumbel_tau_start: 1.0
  gumbel_tau_min: 0.1
  gumbel_anneal_iterations: 20000
  gumbel_anneal_mode: exponential
  # Iteration number to switch from sigmoid to gumbel_softmax
  # 0 means using gumbel_softmax from the beginning
  gumbel_switch_iteration: 500

  # Balance configuration
  # TA avg area: 12295, TB avg area: 19177
  # top_threshold_factor = TA / (TA+TB) = 12295/31472 = 0.3907
  # bottom_threshold_factor = TB / (TA+TB) = 19177/31472 = 0.6093
  # num_bins: die_side/sqrt(lib_avg_area)*1.08 ~ 302 -> 300 (44764 cells)
  balance_loss:
    bottom_threshold_factor: 0.3907
    top_threshold_factor: 0.6093
    num_bins_x: 100
    num_bins_y: 100

# Visualization configuration
visualization:
  output_dir: "results/visualizations"
  save_interval: 50
  log_interval: 200

# Output configuration
output:

  save_training_curves: true
  result_dir: "results"
